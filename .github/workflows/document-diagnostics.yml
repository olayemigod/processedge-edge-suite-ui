name: Document Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependency
        run: python -m pip install --quiet pytest
      - name: Run document and package contracts
        id: tests
        continue-on-error: true
        run: |
          python -m pytest -q \
            edgesuite_ui/tests/test_edgeui_asset_contract.py \
            edgesuite_ui/tests/test_shell_enhancement_contract.py \
            edgesuite_ui/tests/test_dashboard_alignment_and_waffle_contract.py \
            edgesuite_ui/tests/test_form_link_contract.py \
            edgesuite_ui/tests/test_document_components_contract.py \
            edgesuite_ui/tests/test_branch_context_contract.py \
            > pytest-document-diagnostics.txt 2>&1
          cat pytest-document-diagnostics.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-diagnostics
          path: pytest-document-diagnostics.txt
      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
